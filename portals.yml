# Portal Scanner Configuration — Arifuzzaman Moin
# Target roles: Data Analyst, BI Analyst, Business Analyst, Data Engineer, Power Platform Developer, Full-Stack Developer
# Target markets: Germany (primary), Australia (secondary), Malaysia, Remote

title_filter:
  positive:
    # -- Data & BI roles --
    - "Data Analyst"
    - "Business Intelligence"
    - "BI Analyst"
    - "BI Developer"
    - "Power BI"
    - "Data Scientist"
    - "Analytics Engineer"
    - "Reporting Analyst"
    - "Data Visualization"
    - "Dashboard"
    # -- Business Analysis --
    - "Business Analyst"
    - "BA"
    - "Systems Analyst"
    - "Functional Analyst"
    - "Process Analyst"
    - "Digital Transformation"
    - "Requirements"
    # -- Data Engineering --
    - "Data Engineer"
    - "ETL"
    - "Data Pipeline"
    - "Databricks"
    - "Azure Data"
    - "Data Platform"
    - "Data Warehouse"
    # -- Power Platform & Microsoft --
    - "Power Platform"
    - "Power Apps"
    - "Power Automate"
    - "Microsoft 365"
    - "SharePoint"
    - "Dynamics"
    - "Low-Code"
    - "No-Code"
    # -- Software / Full-Stack --
    - "Full-Stack"
    - "Full Stack"
    - "Web Developer"
    - "Software Developer"
    - "Software Engineer"
    - "Frontend Developer"
    - "Backend Developer"
    - "React"
    - "Node.js"
    - "Python Developer"
    # -- German keywords --
    - "Datenanalyst"
    - "Business Analyst"
    - "Dateningenieur"
    - "Softwareentwickler"
    - "Informatiker"
    - "IT-Consultant"
    - "Digitaliserierung"
  negative:
    - "Principal"
    - "Director"
    - "VP "
    - "Vice President"
    - "C-Level"
    - "COBOL"
    - "Mainframe"
    - "SAP ABAP"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Embedded"
    - "Firmware"
    - "iOS"
    - "Android"
    - "Machine Learning Research"
    - "PhD"
    - "10+ years"
    - "15+ years"
  seniority_boost:
    - "Senior"
    - "Lead"
    - "Mid"
    - "Mid-Level"
    - "Intermediate"

# -- Search queries --

search_queries:

  # == GERMANY ==

  - name: Germany — Data Analyst (Greenhouse)
    query: 'site:job-boards.greenhouse.io OR site:job-boards.eu.greenhouse.io "Data Analyst" OR "Business Intelligence" Germany OR Berlin OR Munich OR Hamburg OR Frankfurt'
    enabled: true

  - name: Germany — Business Analyst (Greenhouse)
